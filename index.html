<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

        <meta name="apple-mobile-web-app-capable" content="yes">

        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

            <meta name="theme-color" content="#000000">
            
        <link rel="manifest" href="manifest.json">
            
    <title>Acceso - App de Gastos</title>
    <script src="vendor/supabase-js.js"></script>
    <style>
        /* --- INICIO: Evitar selección de texto accidental --- */
        * {
            -webkit-user-select: none;
            user-select: none;
        }
        input, select, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }
        /* --- FIN: Evitar selección de texto accidental --- */

        /* Estilos generales (los mismos que ya teníamos) */
        /* Agregamos el color al HTML para eliminar el borde blanco raíz */
        html, body { background-color: #000000; }

        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #fff; padding-top: env(safe-area-inset-top); box-sizing: border-box; touch-action: pan-x pan-y; }
        .container { background: #2a2a2a; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #444; border-radius: 6px; background: #333; color: white; box-sizing: border-box; }
        input:focus { outline: none; border-color: #3ecf8e; }
        button { width: 100%; padding: 12px; background-color: #3ecf8e; color: #000000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background-color 0.2s; }
        button:hover { background-color: #2eb87c; }
        .mensaje { margin-top: 10px; font-size: 0.9em; text-align: center; min-height: 20px; }
        .error { color: #ff5c5c; }
        .exito { color: #ffffff; }
        .toggle-link { display: block; text-align: center; margin-top: 15px; color: #ffffff; cursor: pointer; font-size: 0.9em; text-decoration: underline; }
                
                #loginSection, #registerSection { display: none; }

        /* --- INICIO PANTALLA DE CARGA --- */
        /* Negra, con el icono clavado en el centro y una barra fina debajo, como el arranque del
           propio teléfono. Cada pieza va colocada en absoluto respecto al centro de la pantalla, no
           apilada dentro de una caja: así nada cambia de sitio mientras carga, y el relevo entre esta
           pantalla y la del dashboard —que lleva exactamente la misma— no se nota. */
        #splashCarga {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 9999;
            background-color: #000000;
            transition: opacity 0.35s ease-out;
        }
        #splashCarga.oculto { opacity: 0; pointer-events: none; }
        #splashCarga .splash-icono {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 96px;
            height: 96px;
            /* Centrado con márgenes negativos, no con transform: el icono queda en la rejilla de
               píxeles y se ve nítido en pantallas de mucha densidad. */
            margin: -48px 0 0 -48px;
            border-radius: 22px;
            display: block;
        }
        #splashCarga .splash-barra {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 170px;
            height: 4px;
            /* A distancia fija del centro, no del icono: la barra no puede empujar nada. */
            margin: 96px 0 0 -85px;
            background-color: #2a2a2a;
            border-radius: 2px;
            overflow: hidden;
        }
        #splashCarga .splash-relleno {
            width: 0;
            height: 100%;
            background-color: #ffffff;
            border-radius: 2px;
            transition: width 0.35s ease-out;
        }
        /* --- FIN PANTALLA DE CARGA --- */
                .fade-in { animation: fadeIn 0.4s ease-in forwards; }
                @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            </style>
</head>
<body>

<div id="splashCarga">
    <img src="icono-192.png" alt="" class="splash-icono">
    <div class="splash-barra"><div class="splash-relleno" id="splashRelleno"></div></div>
</div>

<div class="container" id="loginSection">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <label>Correo electrónico</label>
        <input type="email" id="emailLogin" required>
        <label>Contraseña</label>
        <input type="password" id="passwordLogin" required>
        <button type="submit" id="btnIngresar">Entrar</button>
    </form>
    <div id="mensajeLogin" class="mensaje"></div>
    <span class="toggle-link" id="linkMostrarRegistro">¿No tienes cuenta? Regístrate aquí</span>
</div>

<div class="container" id="registerSection">
    <h2>Crear Cuenta</h2>
    <form id="registerForm">
        <label>Correo electrónico</label>
        <input type="email" id="emailReg" required>
        <label>Contraseña (Mínimo 6 caracteres)</label>
        <input type="password" id="passwordReg" required minlength="6">
        <button type="submit" id="btnRegistrar">Registrarse</button>
    </form>
    <div id="mensajeReg" class="mensaje"></div>
    <span class="toggle-link" id="linkMostrarLogin">¿Ya tienes cuenta? Inicia sesión</span>
</div>

<script>
    const supabaseUrl = 'https://wmqxajsgqvhpuvqtrtsp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcXhhanNncXZocHV2cXRydHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTk3NTAsImV4cCI6MjA5NDA5NTc1MH0.bOZUxGN4t2tcFg8_Lpi2GD7l4vRHaWRteWhKpvAeDX0';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // La barra no es decorativa: marca por dónde va el arranque. Aquí sólo se comprueba la sesión,
        // que es el primer tramo; el resto —cuentas, categorías, cotizaciones y movimientos— lo recorre
        // el dashboard, que retoma la barra donde la deja esta pantalla.
        const splashRelleno = document.getElementById('splashRelleno');
        function avanzarCarga(porcentaje) {
            if (splashRelleno) splashRelleno.style.width = porcentaje + '%';
        }
        // Un cuadro de espera antes de moverla: si el ancho ya estuviera puesto en el primer pintado,
        // el navegador no tendría de dónde animarlo y el tramo aparecería de golpe.
        requestAnimationFrame(() => avanzarCarga(14));

        clienteSupabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                avanzarCarga(25);
                window.location.replace('dashboard.html');
            } else {
                const splash = document.getElementById('splashCarga');
                if (splash) {
                    splash.classList.add('oculto');
                    setTimeout(() => splash.remove(), 400);
                }
                const loginSection = document.getElementById('loginSection');
                loginSection.style.display = 'block';
                loginSection.classList.add('fade-in');
            }
        });

        document.getElementById('linkMostrarRegistro').addEventListener('click', () => {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('registerSection').style.display = 'block';
    });
    document.getElementById('linkMostrarLogin').addEventListener('click', () => {
        document.getElementById('registerSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
    });

    // Lógica de LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const email = document.getElementById('emailLogin').value;
        const password = document.getElementById('passwordLogin').value;
        const btn = document.getElementById('btnIngresar');
        const msj = document.getElementById('mensajeLogin');

        btn.disabled = true; btn.textContent = 'Iniciando...';
        const { error } = await clienteSupabase.auth.signInWithPassword({ email, password });
        btn.disabled = false; btn.textContent = 'Entrar';

        if (error) {
            msj.textContent = 'Error: ' + error.message; msj.className = 'mensaje error';
        } else {
            // REDIRIGIR AL DASHBOARD
            window.location.replace('dashboard.html');
        }
    });

    // Lógica de REGISTRO
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const email = document.getElementById('emailReg').value;
        const password = document.getElementById('passwordReg').value;
        const btn = document.getElementById('btnRegistrar');
        const msj = document.getElementById('mensajeReg');

        btn.disabled = true; btn.textContent = 'Registrando...';
        const { data, error } = await clienteSupabase.auth.signUp({ email, password });
        btn.disabled = false; btn.textContent = 'Registrarse';

        if (error) {
                    msj.textContent = 'Error: ' + error.message; msj.className = 'mensaje error';
                } else {
                    if (data.session) {
                        // REDIRIGIR AL DASHBOARD
                        window.location.replace('dashboard.html');
                    } else {
                        msj.textContent = '¡Registro exitoso! Revisa tu correo.'; msj.className = 'mensaje exito';
                    }
                }
            });
        </script>

        <!-- REGISTRO DEL SERVICE WORKER -->
        <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registrado:', reg.scope))
                .catch(err => console.error('Error en Service Worker:', err));
            });
          }
        </script>

        </body>
        </html>
